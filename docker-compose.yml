services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ox
      POSTGRES_PASSWORD: ox
      POSTGRES_DB: ox
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ox"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ox:ox@db:5432/ox
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  dbdata:
